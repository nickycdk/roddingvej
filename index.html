  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f6f3ee; --ink: #1f1d1a; --muted: #8a847b; --line: #e4ded4; --card: #ebe6de; --accent: #1f1d1a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    header { position: sticky; top: 0; z-index: 1; background: rgba(246,243,238,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .bar { max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 28px; letter-spacing: -.01em; margin: 0; }
    h1 small { display: block; font-family: Inter, sans-serif; font-size: 13px; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
    .tabs { display: inline-flex; padding: 4px; background: var(--card); border-radius: 999px; gap: 2px; }
    .tabs button { font: 500 14px Inter, sans-serif; color: var(--muted); background: none; border: 0; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
    .tabs button:hover { color: var(--ink); }
    .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .tabs span { color: var(--muted); font-weight: 400; margin-left: 4px; }
    .grid { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 24px; }
    .grid a { position: relative; display: block; aspect-ratio: 1; overflow: hidden; border-radius: 10px; background: var(--card); outline-offset: 3px; }
    .grid a[hidden] { display: none; }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
    .grid a:hover img, .grid a:focus-visible img { transform: scale(1.03); }
    .play { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; font-size: 12px; font-weight: 500; color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); border-radius: 999px; pointer-events: none; }
    .play::before { content: ""; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
    dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
    dialog::backdrop { background: rgba(20,18,16,.94); }
    #stage { width: 100%; height: 100%; display: grid; place-items: center; }
    #stage img, #stage video { max-width: 92vw; max-height: 88vh; border-radius: 6px; }
    #counter { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.7); font-size: 13px; }
    dialog button { position: fixed; display: grid; place-items: center; background: rgba(255,255,255,.1); color: #fff; border: 0; font-size: 26px; line-height: 1; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; transition: background .15s; }
    dialog button:hover { background: rgba(255,255,255,.22); }
    #close { top: 16px; right: 16px; }
    #prev { left: 16px; top: 50%; transform: translateY(-50%); }
    #next { right: 16px; top: 50%; transform: translateY(-50%); }
    @media (max-width: 600px) {
      .bar { padding: 16px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 16px; }
      .grid a { border-radius: 6px; }
      #prev, #next { top: auto; bottom: 16px; transform: none; }
    }
  </style>

  <dialog id="lightbox">
    <div id="stage"></div>
    <div id="counter"></div>
    <button id="prev" aria-label="Forrige">‹</button>
    <button id="next" aria-label="Næste">›</button>
    <button id="close" aria-label="Luk">×</button>
  </dialog>

  <script>
    const all = [...document.querySelectorAll('.grid a')];
    let links = all;
    const box = document.getElementById('lightbox');
    const stage = document.getElementById('stage');
    let i = 0;

    function show(n) {
      i = (n + links.length) % links.length;
      const a = links[i];
      stage.innerHTML = a.dataset.type === 'video'
        ? '<video controls autoplay muted playsinline><source type="video/mp4"></video>'
        : '<img alt="">';
      const el = stage.querySelector(a.dataset.type === 'video' ? 'source' : 'img');
      el.src = a.getAttribute('href');
      if (a.dataset.type === 'video') stage.querySelector('video').load();
      document.getElementById('counter').textContent = `${i + 1} / ${links.length}`;
      if (!box.open) box.showModal();
    }

    all.forEach(a => a.addEventListener('click', e => { e.preventDefault(); show(links.indexOf(a)); }));

    document.querySelectorAll('.tabs button').forEach(tab => tab.addEventListener('click', () => {
      const f = tab.dataset.filter;
      document.querySelectorAll('.tabs button').forEach(t => t.setAttribute('aria-selected', t === tab));
      all.forEach(a => a.hidden = f !== 'all' && a.dataset.type !== f);
      links = all.filter(a => !a.hidden);
    }));
    document.getElementById('prev').onclick = () => show(i - 1);
    document.getElementById('next').onclick = () => show(i + 1);
    document.getElementById('close').onclick = () => box.close();
    box.addEventListener('close', () => stage.innerHTML = '');
    box.addEventListener('click', e => { if (e.target === stage) box.close(); });
    document.addEventListener('keydown', e => {
      if (!box.open) return;
      if (e.key === 'ArrowLeft') show(i - 1);
      if (e.key === 'ArrowRight') show(i + 1);
    });
  </script>

  <title>Roddingvej</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    h1 { font-weight: 500; padding: 16px; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 0 16px 16px; }
    .grid a { position: relative; display: block; aspect-ratio: 4/3; overflow: hidden; border-radius: 6px; background: #222; }
    .grid img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
    .grid a:hover img, .grid a:focus-visible img { transform: scale(1.04); }
    .play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 48px; color: #fff; text-shadow: 0 2px 8px #000; pointer-events: none; }
    dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
    dialog::backdrop { background: rgba(0,0,0,.92); }
    #stage { width: 100%; height: 100%; display: grid; place-items: center; }
    #stage img, #stage video { max-width: 95vw; max-height: 90vh; }
    dialog button { position: fixed; background: rgba(0,0,0,.5); color: #fff; border: 0; font-size: 32px; width: 56px; height: 56px; border-radius: 50%; cursor: pointer; }
    #close { top: 16px; right: 16px; }
    #prev { left: 16px; top: 50%; transform: translateY(-50%); }
    #next { right: 16px; top: 50%; transform: translateY(-50%); }
  </style>
</head>

  <dialog id="lightbox">
    <div id="stage"></div>
    <button id="prev" aria-label="Forrige">‹</button>
    <button id="next" aria-label="Næste">›</button>
    <button id="close" aria-label="Luk">×</button>
  </dialog>

  <script>
    const links = [...document.querySelectorAll('.grid a')];
    const box = document.getElementById('lightbox');
    const stage = document.getElementById('stage');
    let i = 0;

    function show(n) {
      i = (n + links.length) % links.length;
      const a = links[i];
      stage.innerHTML = a.dataset.type === 'video'
        ? '<video controls autoplay playsinline><source type="video/mp4"></video>'
        : '<img alt="">';
      const el = stage.querySelector(a.dataset.type === 'video' ? 'source' : 'img');
      el.src = a.getAttribute('href');
      if (a.dataset.type === 'video') stage.querySelector('video').load();
      if (!box.open) box.showModal();
    }

    links.forEach((a, n) => a.addEventListener('click', e => { e.preventDefault(); show(n); }));
    document.getElementById('prev').onclick = () => show(i - 1);
    document.getElementById('next').onclick = () => show(i + 1);
    document.getElementById('close').onclick = () => box.close();
    box.addEventListener('close', () => stage.innerHTML = '');
    box.addEventListener('click', e => { if (e.target === stage) box.close(); });
    document.addEventListener('keydown', e => {
      if (!box.open) return;
      if (e.key === 'ArrowLeft') show(i - 1);
      if (e.key === 'ArrowRight') show(i + 1);
    });
  </script>
